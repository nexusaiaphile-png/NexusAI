<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110f"><title>NexusAI Customer Security</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b10;color:#eef8f6;font-family:Inter,system-ui,Arial,sans-serif}main{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:24px;font-weight:900}.brand span{display:block;font-size:10px;letter-spacing:2px;color:#63dcb9}.pill{padding:7px 11px;border-radius:999px;background:#123d31;color:#72e6c3;font-size:12px;font-weight:900}.offline{background:#39291b;color:#f4c777}.hero{background:linear-gradient(135deg,#0b191d,#0a1219);border:1px solid #1a353d;border-radius:20px;padding:25px;margin-bottom:18px}.hero h1{font-size:32px;margin:0 0 7px}.muted{color:#91aaa9}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#0b171d;border:1px solid #19323a;border-radius:15px;padding:17px}.metric b{display:block;font-size:25px;margin-top:4px}.card{background:#0b171d;border:1px solid #19323a;border-radius:18px;padding:20px;margin-top:18px}h2{margin:0 0 14px;font-size:19px}.cams{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cam{border:1px solid #1a353d;border-radius:14px;padding:15px;background:#081218}.cam b{display:block;margin-bottom:6px}.online{color:#6ee4bf}.cam small{color:#8ca5a5}.event{padding:14px 0;border-bottom:1px solid #183039}.event:last-child{border:0}.sev{font-size:11px;font-weight:900}.critical{color:#ff7d7d}.high{color:#ffc86d}.normal{color:#74dcb9}.event img{max-width:160px;border-radius:8px;margin-top:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}a,button{color:#6fe7ff;text-decoration:none}button{border:0;background:#19d6a2;color:#03120e;padding:11px 14px;border-radius:10px;font-weight:900;cursor:pointer}.mutedbox{padding:15px;border:1px dashed #29434a;border-radius:12px;color:#91aaa9}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.cams{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.cams{grid-template-columns:1fr}main{padding:13px}}
</style></head><body><main>
<div class="top"><div class="brand">NexusAI<span>CUSTOMER SECURITY PORTAL</span></div><div id="statusPill" class="pill">CONNECTING…</div></div>
<section class="hero"><h1 id="business">Your security site</h1><div id="address" class="muted"></div><div class="actions"><a id="appLink" href="#">Install NexusAI Alerts</a><button onclick="refresh()">REFRESH</button></div></section>
<section class="grid"><div class="metric">CAMERAS<b id="camCount">0</b></div><div class="metric">ONLINE<b id="online">0</b></div><div class="metric">PROTECTED<b id="protected">0</b></div><div class="metric">EVENTS<b id="eventCount">0</b></div></section>
<section class="card"><h2>Your Cameras</h2><div id="cameras" class="cams"></div></section>
<section class="card"><h2>Recent Security Events</h2><div id="events"></div></section>
<section class="card"><h2>NexusAI Alerts</h2><div class="mutedbox">Install the NexusAI Alerts app on your phone to receive push notifications even when this portal is closed.</div></section>
</main>
<script>
const token=new URLSearchParams(location.search).get("token")||"";const $=id=>document.getElementById(id);function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function refresh(){if(!token){$("business").textContent="Invalid customer portal link";return}try{let r=await fetch("/api/customer/session?token="+encodeURIComponent(token),{cache:"no-store"});let d=await r.json();if(!r.ok)throw Error(d.detail||"Portal access denied");$("business").textContent=d.business_name;$("address").textContent=d.store_address||"";$("statusPill").textContent=d.edge_agent==="ONLINE"?"SYSTEM ONLINE":"SYSTEM OFFLINE";$("statusPill").classList.toggle("offline",d.edge_agent!=="ONLINE");$("camCount").textContent=d.cameras.length;$("online").textContent=d.cameras.filter(c=>c.status==="ONLINE"||c.status==="PROTECTED").length;$("protected").textContent=d.cameras.filter(c=>c.status==="PROTECTED"||c.verified).length;$("appLink").href=d.notification_app_url;$("cameras").innerHTML=d.cameras.length?d.cameras.map(c=>'<div class="cam"><b>'+esc(c.camera_name)+'</b><div>'+esc(c.location||"Security camera")+'</div><small class="'+(c.status==="ONLINE"||c.status==="PROTECTED"?"online":"")+'">'+esc(c.status||"UNKNOWN")+'</small></div>').join(""):'<div class="mutedbox">NexusAI is waiting for the Security Box to connect and discover the cameras.</div>';let e=await fetch("/api/customer/events?token="+encodeURIComponent(token)+"&limit=50",{cache:"no-store"});let ed=await e.json();renderEvents(ed.events||[])}catch(e){$("statusPill").textContent="ACCESS ERROR";$("statusPill").classList.add("offline");$("events").innerHTML='<div class="mutedbox">'+esc(e.message)+'</div>'}}
function renderEvents(events){$("eventCount").textContent=events.length;$("events").innerHTML=events.length?events.map(e=>'<div class="event"><div><span class="sev '+esc(String(e.severity||"").toLowerCase())+'">'+esc(e.severity||"EVENT")+'</span> · '+esc(e.timestamp)+'</div><b>'+esc(e.event)+'</b><div class="muted">'+esc(e.camera_name)+' · '+esc(e.location)+'</div>'+(e.id?'<img loading="lazy" src="/api/customer/snapshots/'+encodeURIComponent(e.id)+'?token='+encodeURIComponent(token)+'" alt="Event snapshot" onerror="this.style.display=\'none\'">':"")+'</div>').join(""):'<div class="mutedbox">No security events have been recorded yet.</div>'}
refresh();setInterval(refresh,10000);
</script></body></html>
