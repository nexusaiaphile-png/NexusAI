<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexusAI | Retailer Assessment Admin</title>
<style>
:root{color-scheme:dark;--bg:#06111d;--panel:#0c1d2b;--line:#203b4d;--teal:#27e0c2;--muted:#9db2c0;--white:#f3f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:14px/1.55 system-ui,sans-serif}.wrap{max-width:1300px;margin:auto;padding:28px 20px}h1{margin:0}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px;margin:18px 0}input,select,textarea{background:#071521;color:white;border:1px solid #294456;border-radius:8px;padding:10px;width:100%;margin:5px 0 10px}button{background:var(--teal);color:#03201e;border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}button.alt{background:#19364a;color:white;border:1px solid #31536a}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}th{color:#a9c1ce;text-transform:uppercase;font-size:10px;letter-spacing:.08em}.msg{padding:10px;border-radius:8px;background:#123a35;margin:10px 0}.err{background:#48242c}.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.badge{color:var(--teal);font-weight:800}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="muted">NEXUSAI · PRIVATE ADMIN</div><h1>Retailer Compatibility Applications</h1><p class="muted">Review retailer details and technical PDFs. This workspace is separate from distributor administration.</p>
<section class="panel"><h2>Administrator access</h2><label>Existing NexusAI admin key</label><input id="key" type="password" autocomplete="off"><div><button id="open">OPEN APPLICATIONS</button></div><div id="message"></div></section>
<section id="workspace" hidden><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2>Applications</h2><button class="alt" id="refresh">REFRESH</button></div><div id="applications"></div></section></main>
<script>
const $=id=>document.getElementById(id);let key=sessionStorage.getItem("nexusai_admin_key_assess")||"";$("key").value=key;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,method="GET",body){const r=await fetch(path,{method,headers:{"X-NexusAI-Admin-Key":key,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});const d=await r.json().catch(()=>({detail:"Unexpected response"}));if(!r.ok)throw Error(d.detail||"Request failed");return d}
function message(t,bad=false){$("message").innerHTML='<div class="msg'+(bad?' err':'')+'">'+esc(t)+'</div>'}
async function load(){try{const d=await api("/api/admin/retailer-assessments");$("workspace").hidden=false;$("applications").innerHTML=d.applications.map(a=>'<article class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><span class="badge">'+esc(a.application_id)+'</span><h3>'+esc(a.company_name)+'</h3><div class="muted">'+esc(a.country)+' · '+esc(a.created_at?new Date(a.created_at*1000).toLocaleString():"")+'</div></div><a href="#" data-pdf="'+esc(a.application_id)+'">Download technical PDF</a></div><div class="row"><div><b>Contact</b><br>'+esc(a.contact_name)+' · '+esc(a.role)+'<br>'+esc(a.email)+' · '+esc(a.phone)+'<br>'+esc(a.website)+'</div><div><b>Environment</b><br>Stores: '+esc(a.store_count)+' · Cameras: '+esc(a.camera_count)+'<br>CCTV: '+esc(a.cctv_provider)+' · Hikvision: '+esc(a.uses_hikvision)+'<br>POS: '+esc(a.pos_provider)+' · '+esc(a.pos_version)+'<br>API: '+esc(a.pos_api)+'</div></div><p><b>Objectives</b><br>'+esc(a.objectives)+'</p><p><b>Additional notes</b><br>'+esc(a.additional_notes)+'</p><div class="row"><div><label>Status</label><select id="status-'+esc(a.application_id)+'">'+["NEW","UNDER_REVIEW","NEED_INFO","COMPATIBLE","NOT_COMPATIBLE","PILOT_APPROVED","CLOSED"].map(s=>'<option '+(a.status===s?'selected':'')+'>'+s+'</option>').join("")+'</select></div><div><label>Internal assessment notes</label><textarea id="notes-'+esc(a.application_id)+'" rows="3">'+esc(a.admin_notes)+'</textarea></div></div><button data-save="'+esc(a.application_id)+'">SAVE REVIEW</button></article>').join("")||'<p class="muted">No applications have been submitted.</p>';message("Loaded "+d.applications.length+" application(s).");}catch(e){message(e.message,true)}}
$("open").onclick=async()=>{key=$("key").value.trim();if(!key)return;sessionStorage.setItem("nexusai_admin_key_assess",key);await load()};
$("refresh").onclick=load;
$("applications").addEventListener("click",async e=>{const pdf=e.target.closest("[data-pdf]");if(pdf){e.preventDefault();try{const r=await fetch("/api/admin/retailer-assessments/"+encodeURIComponent(pdf.dataset.pdf)+"/pdf",{headers:{"X-NexusAI-Admin-Key":key},cache:"no-store"});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.detail||"PDF download failed")}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=pdf.dataset.pdf+".pdf";a.click();URL.revokeObjectURL(url)}catch(err){message(err.message,true)}return}const save=e.target.closest("[data-save]");if(save){const id=save.dataset.save;try{await api("/api/admin/retailer-assessments/"+encodeURIComponent(id),"PATCH",{status:$("status-"+id).value,admin_notes:$("notes-"+id).value});message("Application review saved.");}catch(err){message(err.message,true)}}});
if(key)load();
</script></body></html>
