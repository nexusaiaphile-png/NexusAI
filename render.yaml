services:
  - type: web
    name: nexusai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: NEXUSAI_EDGE_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXUSAI_VAPID_PUBLIC_KEY
        sync: false
      - key: NEXUSAI_VAPID_PRIVATE_KEY
        sync: false
      - key: NEXUSAI_VAPID_SUBJECT
        sync: false
      - key: NEXUSAI_APP_LINK_SECRET
        sync: false
