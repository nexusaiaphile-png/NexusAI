name: Hik-Connect adapter validation

on:
  pull_request:
    paths:
      - "backend/src/hikconnect_teams.py"
      - "tests/test_hikconnect_teams.py"
      - ".github/workflows/hikconnect-validation.yml"
      - "backend/requirements.txt"
  push:
    branches: [main, feature/hikconnect-teams-validation]
    paths:
      - "backend/src/hikconnect_teams.py"
      - "tests/test_hikconnect_teams.py"
      - ".github/workflows/hikconnect-validation.yml"
      - "backend/requirements.txt"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run offline adapter tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
