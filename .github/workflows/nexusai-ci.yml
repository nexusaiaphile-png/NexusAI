name: NexusAI CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend edge_agent
      - name: Import backend
        env:
          NEXUSAI_APP_LINK_SECRET: ci-test-secret
          NEXUSAI_EDGE_TOKEN: ci-edge-token
        run: python -c "import backend.src.main; print('NexusAI backend import OK')"

  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, tempfile
          files = list(pathlib.Path("portal").rglob("*.js"))
          for html in pathlib.Path("portal").rglob("*.html"):
              text = html.read_text(encoding="utf-8")
              for i, script in enumerate(re.findall(r"<script(?:[^>]*)>(.*?)</script>", text, flags=re.S|re.I)):
                  if script.strip():
                      p = pathlib.Path(tempfile.gettempdir()) / f"nexusai-inline-{i}.js"
                      p.write_text(script, encoding="utf-8")
                      files.append(p)
          for path in files:
              subprocess.run(["node", "--check", str(path)], check=True)
              print("JavaScript syntax OK:", path)
          PY
