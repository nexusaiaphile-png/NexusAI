name: NexusAI Security Box Native Release

on:
  workflow_dispatch:
  push:
    paths:
      - "edge_agent/**"
      - "macos/build_security_box_pkg.sh"
      - ".github/workflows/security-box-release.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests python-dotenv pywin32
      - name: Build one-click Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --noconsole `
            --name NexusAI-SecurityBox-Setup `
            --uac-admin `
            --hidden-import win32timezone `
            --hidden-import servicemanager `
            --hidden-import win32service `
            --hidden-import win32serviceutil `
            --hidden-import win32event `
            --hidden-import edge_agent.agent `
            --hidden-import edge_agent.secure_store `
            edge_agent/security_box_windows_installer.py
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Copy-Item dist/NexusAI-SecurityBox-Setup.exe dist/release/NexusAI-SecurityBox-Windows.exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-SecurityBox-Windows
          path: dist/release/NexusAI-SecurityBox-Windows.exe

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import Developer ID Application certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERT_BASE64"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/application.p12"
          security create-keychain -p "" "$RUNNER_TEMP/build.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/application.p12" -k "$RUNNER_TEMP/build.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/build.keychain-db"
      - name: Import Developer ID Installer certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERT_BASE64"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$RUNNER_TEMP/build.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/build.keychain-db"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and sign Intel package
        env:
          NEXUSAI_MAC_ARCH: x86_64
          NEXUSAI_SECURITY_BOX_VERSION: 2.1.0
          APPLE_APPLICATION_IDENTITY: ${{ secrets.APPLE_APPLICATION_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          test -n "$APPLE_APPLICATION_IDENTITY"
          test -n "$APPLE_INSTALLER_IDENTITY"
          chmod +x macos/build_security_box_pkg.sh
          ./macos/build_security_box_pkg.sh
      - name: Notarize and staple Intel package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
          xcrun notarytool submit dist/NexusAI-SecurityBox-Mac-Intel.pkg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/NexusAI-SecurityBox-Mac-Intel.pkg
          pkgutil --check-signature dist/NexusAI-SecurityBox-Mac-Intel.pkg
      - name: Upload Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-SecurityBox-Mac-Intel
          path: dist/NexusAI-SecurityBox-Mac-Intel.pkg

  macos-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import Developer ID Application certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERT_BASE64"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/application.p12"
          security create-keychain -p "" "$RUNNER_TEMP/build.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/application.p12" -k "$RUNNER_TEMP/build.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/build.keychain-db"
      - name: Import Developer ID Installer certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERT_BASE64"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$RUNNER_TEMP/build.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/build.keychain-db"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and sign Apple Silicon package
        env:
          NEXUSAI_MAC_ARCH: arm64
          NEXUSAI_SECURITY_BOX_VERSION: 2.1.0
          APPLE_APPLICATION_IDENTITY: ${{ secrets.APPLE_APPLICATION_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          test -n "$APPLE_APPLICATION_IDENTITY"
          test -n "$APPLE_INSTALLER_IDENTITY"
          chmod +x macos/build_security_box_pkg.sh
          ./macos/build_security_box_pkg.sh
      - name: Notarize and staple Apple Silicon package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
          xcrun notarytool submit dist/NexusAI-SecurityBox-Mac-Arm64.pkg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/NexusAI-SecurityBox-Mac-Arm64.pkg
          pkgutil --check-signature dist/NexusAI-SecurityBox-Mac-Arm64.pkg
      - name: Upload Apple Silicon artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-SecurityBox-Mac-Arm64
          path: dist/NexusAI-SecurityBox-Mac-Arm64.pkg

  publish:
    needs: [windows, macos-intel, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: NexusAI-SecurityBox-Windows
          path: dist
      - name: Download Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: NexusAI-SecurityBox-Mac-Intel
          path: dist
      - name: Download Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: NexusAI-SecurityBox-Mac-Arm64
          path: dist
      - name: Publish moving release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view security-box-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            :
          else
            gh release create security-box-latest --repo "$GITHUB_REPOSITORY" --title "NexusAI Security Box latest" --notes "Latest native NexusAI Security Box installers."
          fi
          gh release upload security-box-latest --repo "$GITHUB_REPOSITORY" \
            dist/NexusAI-SecurityBox-Windows.exe \
            dist/NexusAI-SecurityBox-Mac-Intel.pkg \
            dist/NexusAI-SecurityBox-Mac-Arm64.pkg \
            --clobber
