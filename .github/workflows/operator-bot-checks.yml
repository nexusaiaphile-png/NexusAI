name: Operator Bot Checks

on:
  push:
    branches: ["feature/devops-operator-safe-mode"]
    paths:
      - "operator_bot/**"
      - ".github/workflows/operator-bot-checks.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "operator_bot/**"
      - ".github/workflows/operator-bot-checks.yml"

jobs:
  validate-operator-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install operator bot dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile operator bot
        run: python -m py_compile bot.py
