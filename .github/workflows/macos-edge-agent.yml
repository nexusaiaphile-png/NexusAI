name: NexusAI macOS Edge Agent (legacy)

# Superseded by security-box-release.yml.
# Kept manual-only so old package builds cannot publish or conflict with the
# production NexusAI Security Box installer.

on:
  workflow_dispatch:

jobs:
  legacy-build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build legacy package
        run: |
          chmod +x macos/build_pkg.sh
          ./macos/build_pkg.sh
      - name: Upload legacy artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-Edge-Agent-macOS-legacy
          path: dist/*.pkg
