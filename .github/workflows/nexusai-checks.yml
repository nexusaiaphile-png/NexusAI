name: NexusAI checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall backend edge_agent main.py
      - name: Validate app JavaScript
        run: node --check nexusai-app/app.js
      - name: Validate service worker
        run: node --check nexusai-app/service-worker.js
      - name: Validate portal JavaScript
        run: node --check portal/app.js
