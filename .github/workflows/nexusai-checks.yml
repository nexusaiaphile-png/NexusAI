name: NexusAI checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            edge_agent/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Edge Agent dependencies
        run: python -m pip install -r edge_agent/requirements.txt
      - name: Compile Python
        run: python -m compileall backend edge_agent main.py
      - name: Import Edge Agent
        run: python -c "import edge_agent.agent; print('Edge Agent import OK')"
      - name: Validate app JavaScript
        run: node --check nexusai-app/app.js
      - name: Validate service worker
        run: node --check nexusai-app/service-worker.js
      - name: Validate portal JavaScript
        run: node --check portal/app.js
      - name: Validate simple protection JavaScript
        run: node --check portal/protect/app.js

  edge-agent-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Edge Agent dependencies
        run: python -m pip install -r edge_agent/requirements.txt pyinstaller==6.22.3
      - name: Build Edge Agent
        shell: bash
        run: python -m PyInstaller --clean --noconfirm --onedir --name NexusAI-Edge-Agent edge_agent/agent.py
      - name: Verify build output
        shell: bash
        run: |
          test -e "dist/NexusAI-Edge-Agent" || test -e "dist/NexusAI-Edge-Agent/NexusAI-Edge-Agent.exe"
