name: Partner portal tests

on:
  push:
    branches:
      - feature/nexusai-partner-recruitment
  pull_request:
    branches:
      - main
      - feature/public-youth-website

jobs:
  partner-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Run partner portal isolation tests
        run: python -m pytest -q backend/tests/test_partner_portal.py
